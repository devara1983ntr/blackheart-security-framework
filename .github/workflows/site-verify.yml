name: site-verify

# Runs the two browser gates in CI.
#
# Why this exists
# ---------------
# `check_contrast.py` and `test_interactions.py` measure the published site in a
# real engine: WCAG AA across both themes including gradient-clipped text, and
# 81 behavioural checks covering overflow at four viewports, keyboard tab order,
# the tabs pattern, the error banner, and graceful degradation when a script
# throws. They were the only gates in this repository that CI never ran — they
# were local-only, on the grounds that they need a browser.
#
# A gate that only runs when someone remembers to run it is a gate that runs
# when it is least needed. The failures they catch are exactly the ones static
# analysis cannot see: a colour that measures 4.41:1, a control the keyboard
# cannot reach, a page that breaks at 320px. So they run here, on every change.
#
# No `paths: site/**` filter, on purpose: a path filter combined with a required
# status check means a pull request that does not touch `site/` never sees the
# check report, and waits forever on a status that cannot arrive. The full job
# takes about two minutes, which is a fair price for it being requirable.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-gates:
    name: Browser gates on the published site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install Playwright and its browser
        # Pinned, for the same reason the scanners are: an unpinned browser
        # turning a release into a red build with no change to this repository
        # is not a signal anyone can act on. Dependabot cannot manage this pin
        # because the repository ships no authored dependency manifest, so
        # bumping it is a deliberate, reviewed change.
        run: |
          python -m pip install --quiet --disable-pip-version-check 'playwright==1.63.0'
          python -m playwright install --with-deps chromium

      - name: Colour contrast, measured in both themes
        run: python3 site/check_contrast.py

      - name: Interactive behaviour, keyboard access and responsive layout
        run: python3 site/test_interactions.py
